<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LD Studios infoskærm dashboard</title>
  <style>
    :root {
      --bg-color: #080b11;
      --surface-1: #111826;
      --surface-2: #171f31;
      --surface-3: #0d1320;
      --text-color: #f5f7ff;
      --muted-text: #a6b2ce;
      --primary-color: #6cb7ff;
      --secondary-color: #66e0a3;
      --room-occupied: #ff6b6b;
      --room-available: #5fdb9d;
      --room-pending: #ffd76a;
      --lamp-on: #ffd76a;
      --lamp-off: #333b4d;
      --border-color: #2a3449;
      --font-family: "Inter", "Segoe UI", Arial, sans-serif;
      --header-height: 11vh;
      --footer-height: 22vh;
      --main-height: 67vh;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      background:
        radial-gradient(120% 100% at 10% -10%, #1f335b 0%, transparent 40%),
        radial-gradient(120% 100% at 90% -15%, #2a214f 0%, transparent 35%),
        var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
      display: grid;
      grid-template-rows: var(--header-height) var(--main-height) var(--footer-height);
      height: 100vh;
      letter-spacing: 0.01em;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2vw;
      background: linear-gradient(180deg, rgba(27, 37, 60, 0.92), rgba(14, 21, 35, 0.92));
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      height: 7vh;
      max-width: 35vw;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.4));
    }

    .datetime {
      text-align: right;
      font-size: 2.3vw;
      font-weight: 700;
      line-height: 1.1;
    }

    .date {
      margin-top: 0.35vw;
      font-size: 1.25vw;
      color: var(--muted-text);
      font-weight: 500;
      text-transform: capitalize;
    }

    main {
      display: flex;
      gap: 1.2vw;
      padding: 1.2vw;
    }

    .studio-visual {
      flex: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: linear-gradient(165deg, rgba(27, 34, 52, 0.9), rgba(16, 23, 37, 0.9));
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .studio-visual img {
      max-width: 96%;
      max-height: 96%;
      object-fit: contain;
      border-radius: 12px;
    }

    .clickable-area {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    #lamp-studio-1 {
      top: 35%;
      left: 30%;
      width: 1.7vw;
      height: 1.7vw;
    }

    #lamp-studio-2 {
      top: 35%;
      left: 60%;
      width: 1.7vw;
      height: 1.7vw;
    }

    .rooms-panel {
      flex: 1;
      background: linear-gradient(180deg, rgba(21, 30, 47, 0.94), rgba(14, 20, 32, 0.96));
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 1.3vw;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      gap: 0.9vw;
    }

    .room-status {
      background: linear-gradient(180deg, rgba(41, 54, 80, 0.5), rgba(21, 30, 47, 0.7));
      border: 1px solid rgba(100, 117, 153, 0.35);
      border-radius: 14px;
      padding: 1.1vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 11.5vh;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.55vw;
    }

    .room-name {
      font-size: 1.5vw;
      font-weight: 700;
    }

    .room-indicator {
      width: 1.1vw;
      height: 1.1vw;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }

    .room-time {
      font-size: 1.15vw;
      color: var(--muted-text);
      font-weight: 500;
    }

    .room-status.occupied .room-indicator {
      background-color: var(--room-occupied);
      color: var(--room-occupied);
    }

    .room-status.available .room-indicator {
      background-color: var(--room-available);
      color: var(--room-available);
    }

    .room-status.pending .room-indicator {
      background-color: var(--room-pending);
      color: var(--room-pending);
    }

    footer {
      background: linear-gradient(180deg, rgba(16, 23, 37, 0.96), rgba(10, 16, 27, 0.98));
      border-top: 1px solid var(--border-color);
      padding: 1.1vw 1.4vw;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      overflow-y: auto;
      gap: 0.7vw;
    }

    .upcoming-header {
      font-size: 1.25vw;
      font-weight: 700;
      color: #d9e4ff;
      margin-bottom: 0.2vw;
    }

    .upcoming-booking {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-size: 1.05vw;
      padding: 0.75vw 0.95vw;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(41, 54, 80, 0.45), rgba(22, 31, 49, 0.65));
      border: 1px solid rgba(100, 117, 153, 0.3);
      color: #e5ebfd;
    }

    .upcoming-room-name {
      font-weight: 700;
    }

    .upcoming-time {
      color: #b8c4e2;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      body {
        grid-template-rows: auto 1fr auto;
        overflow-y: auto;
        height: auto;
        min-height: 100vh;
      }

      header {
        flex-direction: column;
        text-align: center;
        padding: 3vw;
      }

      .logo {
        height: 7vh;
        margin-bottom: 1vh;
      }

      .datetime {
        font-size: 6vw;
      }

      .date {
        font-size: 3.2vw;
      }

      main {
        flex-direction: column;
        padding: 3vw;
        gap: 3vw;
      }

      .studio-visual {
        height: 48vh;
      }

      .rooms-panel {
        padding: 3vw;
        gap: 2.4vw;
      }

      .room-status {
        padding: 3vw;
        min-height: 10vh;
      }

      .room-name {
        font-size: 5vw;
      }

      .room-indicator {
        width: 3.2vw;
        height: 3.2vw;
      }

      .room-time {
        font-size: 3.4vw;
      }

      footer {
        padding: 3vw;
        gap: 2vw;
      }

      .upcoming-header {
        font-size: 4.3vw;
      }

      .upcoming-booking {
        font-size: 3.2vw;
        padding: 2.2vw 2.6vw;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://ld-dk2600.github.io/LD_screen1/01Logo_white_HIGH.png" alt="LD Studios Logo" class="logo">
    <div class="datetime">
      <div class="time" id="time"></div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <main>
    <div class="studio-visual">
      <img src="https://ld-dk2600.github.io/LD_screen1/LDstudiiosmap.png" alt="Studio Layout" usemap="#studio-map">
      <map name="studio-map">
        <area shape="circle" coords="300,200,50" href="#" alt="Studio 1" id="area-studio-1" data-room-id="studio-1">
        <area shape="circle" coords="700,200,50" href="#" alt="Studio 2" id="area-studio-2" data-room-id="studio-2">
      </map>
      <div class="clickable-area" id="lamp-studio-1" data-room-id="studio-1"></div>
      <div class="clickable-area" id="lamp-studio-2" data-room-id="studio-2"></div>
    </div>

    <div class="rooms-panel" id="rooms-panel"></div>
  </main>

  <footer>
    <div class="upcoming-header">Næste bookinger:</div>
    <div class="upcoming-bookings-list" id="upcoming-bookings-list"></div>
  </footer>

  <script>
    const BRUGE_SUPABASE = false;
    let SUPABASE_URL = "";
    let SUPABASE_ANON_KEY = "";

    async function initSupabase() {
      if (BRUGE_SUPABASE) {
        return getMock();
      } else {
        return getMock();
      }
    }

    function getMock() {
      const now = new Date();
      const addHours = (date, h) => new Date(date.getTime() + h * 60 * 60 * 1000);
      const addMinutes = (date, m) => new Date(date.getTime() + m * 60 * 1000);

      const rooms = [
        { id: "studio-1", name: "Studio 1" },
        { id: "studio-2", name: "Studio 2" }
      ];

      const bookings = [
        { room_id: "studio-1", start_time: addMinutes(now, -30).toISOString(), end_time: addMinutes(now, 30).toISOString(), title: "Session A", status: "occupied" },
        { room_id: "studio-2", start_time: addHours(now, 1).toISOString(), end_time: addHours(now, 3).toISOString(), title: "Session B", status: "pending" },
        { room_id: "studio-1", start_time: addHours(now, 2).toISOString(), end_time: addHours(now, 4).toISOString(), title: "Session C", status: "pending" },
        { room_id: "studio-2", start_time: addMinutes(now, -90).toISOString(), end_time: addMinutes(now, -30).toISOString(), title: "Past Session D", status: "completed" }
      ];

      return { rooms, bookings };
    }

    function fmt(dateString) {
      const date = new Date(dateString);
      return date.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
    }

    function isNow(start, end) {
      const now = new Date();
      const startDate = new Date(start);
      const endDate = new Date(end);
      return now >= startDate && now < endDate;
    }

    function isToday(dateString) {
      const today = new Date();
      const date = new Date(dateString);
      return date.getDate() === today.getDate() && date.getMonth() === today.getMonth() && date.getFullYear() === today.getFullYear();
    }

    function status(room, bookings) {
      const now = new Date();
      const currentBooking = bookings.find((b) => b.room_id === room.id && isNow(b.start_time, b.end_time));
      if (currentBooking) {
        return { status: "occupied", time: `${fmt(currentBooking.start_time)} - ${fmt(currentBooking.end_time)}` };
      }

      const nextBooking = bookings
        .filter((b) => b.room_id === room.id && new Date(b.start_time) > now)
        .sort((a, b) => new Date(a.start_time) - new Date(b.start_time))[0];

      if (nextBooking && isToday(nextBooking.start_time)) {
        return { status: "pending", time: `${fmt(nextBooking.start_time)} - ${fmt(nextBooking.end_time)}` };
      }

      return { status: "available", time: "Ledig" };
    }

    async function render() {
      const { rooms, bookings } = await initSupabase();
      const roomsPanel = document.getElementById("rooms-panel");
      roomsPanel.innerHTML = "";

      const upcomingBookingsList = document.getElementById("upcoming-bookings-list");
      upcomingBookingsList.innerHTML = "";

      const now = new Date();
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);

      const relevantBookings = bookings.filter((b) => {
        const bookingDate = new Date(b.start_time);
        return bookingDate >= today && bookingDate < tomorrow;
      });

      rooms.forEach((room) => {
        const roomStatusData = status(room, bookings);
        const roomElement = document.createElement("div");
        roomElement.classList.add("room-status", roomStatusData.status);
        roomElement.innerHTML = `
          <div class="room-header">
            <div class="room-name">${room.name}</div>
            <div class="room-indicator"></div>
          </div>
          <div class="room-time">${roomStatusData.time}</div>
        `;
        roomsPanel.appendChild(roomElement);

        const lamp = document.getElementById(`lamp-${room.id}`);
        if (lamp) {
          if (roomStatusData.status === "occupied") {
            lamp.style.backgroundColor = "var(--lamp-on)";
            lamp.style.boxShadow = "0 0 15px var(--lamp-on)";
          } else {
            lamp.style.backgroundColor = "var(--lamp-off)";
            lamp.style.boxShadow = "none";
          }
        }
      });

      const sortedUpcomingBookings = relevantBookings
        .filter((b) => new Date(b.start_time) > now)
        .sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

      sortedUpcomingBookings.slice(0, 3).forEach((booking) => {
        const upcomingBookingElement = document.createElement("div");
        upcomingBookingElement.classList.add("upcoming-booking");
        upcomingBookingElement.innerHTML = `
          <span class="upcoming-room-name">${rooms.find((r) => r.id === booking.room_id)?.name || booking.room_id}</span>
          <span class="upcoming-time">${fmt(booking.start_time)} - ${fmt(booking.end_time)}</span>
        `;
        upcomingBookingsList.appendChild(upcomingBookingElement);
      });

      if (!sortedUpcomingBookings.length) {
        const emptyState = document.createElement("div");
        emptyState.classList.add("upcoming-booking");
        emptyState.innerHTML = `
          <span class="upcoming-room-name">Ingen flere bookinger i dag</span>
          <span class="upcoming-time">-</span>
        `;
        upcomingBookingsList.appendChild(emptyState);
      }
    }

    function clock() {
      const now = new Date();
      const timeElement = document.getElementById("time");
      const dateElement = document.getElementById("date");

      timeElement.textContent = now.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
      dateElement.textContent = now.toLocaleDateString("da-DK", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      render();
      setTimeout(clock, 1000 * 30);
    }

    document.addEventListener("DOMContentLoaded", () => {
      clock();
    });
  </script>
</body>
</html>
