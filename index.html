<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LD Studios infoskærm dashboard</title>
  <link rel="preload" href="01Logo_white_HIGH.png" as="image">
  <link rel="preload" href="LDstudiiosmap.png" as="image">
  <link rel="preload" href="slideshow-opt/IMG_0592.jpg" as="image" fetchpriority="high">
  <style>
    :root {
      --bg-color: #080b11;
      --surface-1: #111826;
      --surface-2: #171f31;
      --surface-3: #0d1320;
      --text-color: #f5f7ff;
      --muted-text: #a6b2ce;
      --primary-color: #6cb7ff;
      --secondary-color: #66e0a3;
      --room-occupied: #ff6b6b;
      --room-available: #5fdb9d;
      --room-pending: #ffd76a;
      --border-color: #2a3449;
      --font-family: "Inter", "Segoe UI", Arial, sans-serif;
      --header-height: auto;
      --footer-height: auto;
      --main-height: 1fr;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      background:
        radial-gradient(120% 100% at 10% -10%, #1f335b 0%, transparent 40%),
        radial-gradient(120% 100% at 90% -15%, #2a214f 0%, transparent 35%),
        var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      overflow-y: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      letter-spacing: 0.01em;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2vw;
      background: linear-gradient(180deg, rgba(27, 37, 60, 0.92), rgba(14, 21, 35, 0.92));
      border-bottom: 1px solid var(--border-color);
    }

    .welcome-title {
      font-size: 2.1vw;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #eaf1ff;
      text-transform: uppercase;
      text-align: center;
    }

    .logo {
      height: 7vh;
      max-width: 35vw;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.4));
    }

    .datetime {
      text-align: right;
      font-size: 2.3vw;
      font-weight: 700;
      line-height: 1.1;
    }

    .date {
      margin-top: 0.35vw;
      font-size: 1.25vw;
      color: var(--muted-text);
      font-weight: 500;
      text-transform: capitalize;
    }

    .build-tag {
      margin-top: 0.45vw;
      display: inline-block;
      padding: 0.2vw 0.6vw;
      border-radius: 999px;
      font-size: 0.72vw;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #061223;
      background: linear-gradient(180deg, #7ce6ae, #4dc68a);
    }

    main {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 1.2vw;
      padding: 1.2vw;
      min-height: 0;
    }

    .studio-visual {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.9vw;
      position: relative;
      background: linear-gradient(165deg, rgba(27, 34, 52, 0.9), rgba(16, 23, 37, 0.9));
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .studio-visual img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center center;
      border-radius: 12px;
    }

    .side-empty-box {
      border: 1px solid var(--border-color);
      border-radius: 18px;
      background: linear-gradient(165deg, rgba(27, 34, 52, 0.55), rgba(16, 23, 37, 0.55));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slideshow-frame {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .slide-image {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: auto;
      min-height: 100%;
      transform: translateY(-50%);
      border-radius: 16px;
      opacity: 0;
      transition: opacity 1.05s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 1;
      will-change: opacity;
    }

    .slide-image.active {
      z-index: 2;
      opacity: 1;
    }

    .slideshow-empty {
      position: relative;
      z-index: 1;
      color: #8ea0c8;
      font-size: 0.95vw;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 1vw;
    }

    footer {
      background: linear-gradient(180deg, rgba(16, 23, 37, 0.96), rgba(10, 16, 27, 0.98));
      border-top: 1px solid var(--border-color);
      padding: 1.1vw 1.4vw;
      margin: 0 1.2vw 1.2vw;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      overflow-y: auto;
      gap: 0.7vw;
      min-height: 0;
    }

    .upcoming-header {
      font-size: 1.25vw;
      font-weight: 700;
      color: #d9e4ff;
      margin-bottom: 0.2vw;
    }

    .upcoming-bookings-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.65vw;
      min-height: 0;
    }

    .studio-booking-card {
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(41, 54, 80, 0.45), rgba(22, 31, 49, 0.65));
      border: 1px solid rgba(100, 117, 153, 0.3);
      color: #e5ebfd;
      padding: 0.65vw 0.75vw;
      min-height: 8.4vh;
      display: flex;
      flex-direction: column;
      gap: 0.3vw;
      overflow: hidden;
    }

    .studio-booking-title {
      font-size: 0.98vw;
      font-weight: 700;
      color: #f0f5ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .studio-booking-line {
      font-size: 0.86vw;
      color: #b8c4e2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 768px) {
      body {
        grid-template-rows: auto 1fr auto;
        overflow-y: auto;
        height: auto;
        min-height: 100vh;
      }

      header {
        flex-direction: column;
        text-align: center;
        padding: 3vw;
      }

      .logo {
        height: 7vh;
        margin-bottom: 1vh;
      }

      .datetime {
        font-size: 6vw;
      }

      .welcome-title {
        font-size: 5vw;
      }

      .date {
        font-size: 3.2vw;
      }

      .build-tag {
        margin-top: 1.2vw;
        font-size: 2vw;
        padding: 0.8vw 2.2vw;
      }

      main {
        grid-template-columns: 1fr;
        gap: 2vw;
        padding: 3vw 3vw 1.5vw;
      }

      .studio-visual {
        height: 48vh;
        padding: 2vw;
      }

      .side-empty-box {
        min-height: 12vh;
      }

      .slide-image {
        width: 100%;
        height: auto;
        min-height: 100%;
      }

      .slideshow-empty {
        font-size: 2.8vw;
        padding: 2vw;
      }

      footer {
        padding: 3vw;
        margin: 0 3vw 3vw;
        gap: 2vw;
      }

      .upcoming-header {
        font-size: 4.3vw;
      }

      .upcoming-bookings-list {
        grid-template-columns: 1fr;
        gap: 2vw;
      }

      .studio-booking-card {
        padding: 2.2vw 2.6vw;
        min-height: auto;
      }

      .studio-booking-title {
        font-size: 3.4vw;
      }

      .studio-booking-line {
        font-size: 3vw;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://ld-dk2600.github.io/LD_screen1/01Logo_white_HIGH.png" alt="LD Studios Logo" class="logo" fetchpriority="high" decoding="async">
    <div class="welcome-title">Velkommen</div>
    <div class="datetime">
      <div class="time" id="time"></div>
      <div class="date" id="date"></div>
      <div class="build-tag">LIVE V2</div>
    </div>
  </header>

  <main>
    <div class="studio-visual">
      <img src="https://ld-dk2600.github.io/LD_screen1/LDstudiiosmap.png" alt="Studio Layout" fetchpriority="high" decoding="async">
    </div>
    <div class="side-empty-box" aria-label="Billedslideshow">
      <div class="slideshow-frame" id="slideshow-frame">
        <img
          id="slideshow-early"
          class="slide-image active"
          alt="LD Studios billede"
          src="slideshow-opt/IMG_0592.jpg"
          width="800"
          height="600"
          loading="eager"
          decoding="sync"
          fetchpriority="high">
      </div>
      <div class="slideshow-empty" id="slideshow-empty">Tilføj billeder til slideshow...</div>
    </div>

  </main>

  <footer>
    <div class="upcoming-header">Dagens bookinger (Studie 1-4):</div>
    <div class="upcoming-bookings-list" id="upcoming-bookings-list"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const BRUGE_SUPABASE = true;
    const SUPABASE_URL = "https://vvrruinrupnginlkixeq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_YbvhilZ2n49AVN1VWZvEuw_1vjQP-mk";
    const DEFAULT_STUDIOS = [
      { id: "studio-1", name: "Studie 1" },
      { id: "studio-2", name: "Studie 2" },
      { id: "studio-3", name: "Studie 3" },
      { id: "studio-4", name: "Studie 4" }
    ];
    const SLIDESHOW_SOURCES = [
      "slideshow-opt/IMG_0592.jpg",
      "slideshow-opt/IMG_1433.jpg",
      "slideshow-opt/IMG_1540.jpg",
      "slideshow-opt/IMG_4505%20(1).jpg",
      "slideshow-opt/Podcast%201.jpg",
      "slideshow-opt/Stage1.jpg",
      "slideshow-opt/stream%203.jpg"
    ];

    let slideshowIndex = 0;
    let slideshowTimer = null;

    async function initSupabase() {
      if (BRUGE_SUPABASE) {
        try {
          return await getLiveSupabaseData();
        } catch (error) {
          console.error("Supabase fetch failed, using empty studio fallback:", error);
          return getEmptyStudioState();
        }
      } else {
        return getMock();
      }
    }

    async function getLiveSupabaseData() {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const { data: studios, error: studiosError } = await client
        .from("Studio")
        .select("id,name");
      if (studiosError) {
        throw studiosError;
      }

      const { data: bookingsRaw, error: bookingsError } = await client
        .from("Booking")
        .select("*")
        .eq("status", "Confirmed")
        .order("startTime", { ascending: true });
      if (bookingsError) {
        throw bookingsError;
      }

      // Customer lookup is optional: if policy blocks this table, keep live booking data.
      let customerNameById = new Map();
      try {
        const { data: customers, error: customersError } = await client
          .from("Customer")
          .select("id,name");
        if (!customersError && Array.isArray(customers)) {
          customerNameById = new Map(customers.map((c) => [String(c.id), c.name || "Ukendt kunde"]));
        } else if (customersError) {
          console.warn("Customer table not available for anon:", customersError.message);
        }
      } catch (error) {
        console.warn("Customer lookup failed, continuing without customer names:", error);
      }

      const rooms = (studios || [])
        .filter((studio) => (studio.name || "").toLowerCase().includes("studie"))
        .map((studio) => ({
          id: `studio-${studio.id}`,
          name: studio.name
        }));

      const bookings = (bookingsRaw || [])
        .map((booking) => {
          const studioId =
            booking.studioId ||
            booking.studio_id ||
            booking.room_id ||
            booking.roomId ||
            booking.StudioId;

          if (!studioId || !booking.startTime || !booking.endTime) {
            return null;
          }

          return {
            room_id: `studio-${studioId}`,
            start_time: new Date(booking.startTime).toISOString(),
            end_time: new Date(booking.endTime).toISOString(),
            title: booking.title || booking.name || "Booking",
            customer_name: customerNameById.get(String(booking.customerId)) || "Ukendt kunde",
            status: "confirmed"
          };
        })
        .filter(Boolean);

      return { rooms: rooms.length ? rooms : DEFAULT_STUDIOS, bookings };
    }

    function getEmptyStudioState() {
      return { rooms: DEFAULT_STUDIOS, bookings: [] };
    }

    function getMock() {
      const now = new Date();
      const addHours = (date, h) => new Date(date.getTime() + h * 60 * 60 * 1000);
      const addMinutes = (date, m) => new Date(date.getTime() + m * 60 * 1000);

      const rooms = [
        { id: "studio-1", name: "Studio 1" },
        { id: "studio-2", name: "Studio 2" }
      ];

      const bookings = [
        { room_id: "studio-1", start_time: addMinutes(now, -30).toISOString(), end_time: addMinutes(now, 30).toISOString(), title: "Session A", status: "occupied" },
        { room_id: "studio-2", start_time: addHours(now, 1).toISOString(), end_time: addHours(now, 3).toISOString(), title: "Session B", status: "pending" },
        { room_id: "studio-1", start_time: addHours(now, 2).toISOString(), end_time: addHours(now, 4).toISOString(), title: "Session C", status: "pending" },
        { room_id: "studio-2", start_time: addMinutes(now, -90).toISOString(), end_time: addMinutes(now, -30).toISOString(), title: "Past Session D", status: "completed" }
      ];

      return { rooms, bookings };
    }

    function fmt(dateString) {
      const date = new Date(dateString);
      return date.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
    }

    async function render() {
      const { rooms, bookings } = await initSupabase();
      const upcomingBookingsList = document.getElementById("upcoming-bookings-list");
      upcomingBookingsList.innerHTML = "";

      const now = new Date();
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);

      const relevantBookings = bookings.filter((b) => {
        const bookingDate = new Date(b.start_time);
        return bookingDate >= today && bookingDate < tomorrow;
      });

      rooms.forEach((room) => {
        const roomBookings = relevantBookings
          .filter((b) => b.room_id === room.id)
          .sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

        const nextBooking = roomBookings.find((b) => new Date(b.end_time) >= now) || roomBookings[0];
        const card = document.createElement("div");
        card.classList.add("studio-booking-card");

        if (nextBooking) {
          card.innerHTML = `
            <div class="studio-booking-title">${room.name}</div>
            <div class="studio-booking-line">${fmt(nextBooking.start_time)} - ${fmt(nextBooking.end_time)}</div>
            <div class="studio-booking-line">${nextBooking.title || "Booking"}</div>
            <div class="studio-booking-line">${nextBooking.customer_name || "Ukendt kunde"}</div>
          `;
        } else {
          card.innerHTML = `
            <div class="studio-booking-title">${room.name}</div>
            <div class="studio-booking-line">Ingen bookinger i dag</div>
          `;
        }

        upcomingBookingsList.appendChild(card);
      });
    }

    function clock() {
      const now = new Date();
      const timeElement = document.getElementById("time");
      const dateElement = document.getElementById("date");

      timeElement.textContent = now.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
      dateElement.textContent = now.toLocaleDateString("da-DK", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      render();
      setTimeout(clock, 1000 * 30);
    }

    document.addEventListener("DOMContentLoaded", () => {
      initSlideshow();
      clock();
    });

    function initSlideshow() {
      const frame = document.getElementById("slideshow-frame");
      const empty = document.getElementById("slideshow-empty");
      if (!frame || !empty || !SLIDESHOW_SOURCES.length) return;

      let layerA = frame.querySelector("#slideshow-early");
      let layerB;

      const firstUrl = SLIDESHOW_SOURCES[0];
      const earlyOk = layerA instanceof HTMLImageElement && layerA.getAttribute("src") === firstUrl;

      if (earlyOk) {
        layerA.classList.add("slide-image");
        layerA.alt = "LD Studios billede";
        layerA.loading = "eager";
        layerB = document.createElement("img");
        frame.appendChild(layerB);
      } else {
        if (layerA) layerA.remove();
        frame.replaceChildren();
        layerA = document.createElement("img");
        layerB = document.createElement("img");
        frame.appendChild(layerA);
        frame.appendChild(layerB);
      }

      const layers = [layerA, layerB];

      layers.forEach((layer) => {
        if (!layer.classList.contains("slide-image")) {
          layer.className = "slide-image";
        }
        layer.alt = "LD Studios billede";
        layer.loading = "eager";
        if (layer.id !== "slideshow-early") layer.decoding = "async";
      });
      layerA.fetchPriority = "high";
      layerB.fetchPriority = "low";

      async function loadSlideIntoLayer(layer, slideIndex) {
        const url = SLIDESHOW_SOURCES[slideIndex];
        if (
          layer.dataset.slideIndexStored === String(slideIndex)
          && layer.complete
          && layer.naturalWidth > 0
        ) {
          return true;
        }

        layer.dataset.slideIndexStored = String(slideIndex);
        layer.src = url;

        const ok = await new Promise((resolve) => {
          if (layer.complete && layer.naturalWidth > 0) {
            resolve(true);
            return;
          }
          layer.onload = () => resolve(layer.naturalWidth > 0);
          layer.onerror = () => resolve(false);
        });

        return ok;
      }

      async function resolveNextSlide(fromIndex, layer) {
        const n = SLIDESHOW_SOURCES.length;
        let pick = fromIndex % n;
        for (let tries = 0; tries < n; tries += 1) {
          if (await loadSlideIntoLayer(layer, pick)) return pick;
          pick = (pick + 1) % n;
        }
        return -1;
      }

      function clearInlineTransition(el) {
        el.style.removeProperty("transition");
      }

      function revealStandbyNoFade(standby) {
        standby.style.transition = "none";
        standby.classList.add("active");
        standby.offsetHeight;
        clearInlineTransition(standby);
      }

      function crossfade(activeIdx, instant) {
        const cur = layers[activeIdx];
        const standby = layers[1 - activeIdx];

        if (instant) {
          layerA.style.transition = "none";
          layerB.style.transition = "none";
          standby.classList.add("active");
          cur.classList.remove("active");
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              clearInlineTransition(layerA);
              clearInlineTransition(layerB);
            });
          });
          return;
        }

        requestAnimationFrame(() => {
          revealStandbyNoFade(standby);
          cur.classList.remove("active");
        });
      }

      (async () => {
        const n = SLIDESHOW_SOURCES.length;

        const firstSlide = await resolveNextSlide(0, layerA);
        if (firstSlide < 0) {
          empty.textContent = "Kunne ikke indlæse billeder";
          empty.style.display = "";
          frame.replaceChildren();
          return;
        }

        slideshowIndex = firstSlide;
        layerB.classList.remove("active");
        revealStandbyNoFade(layerA);
        empty.style.display = "none";

        function prefetchSlideIndex(i) {
          if (i < 0 || i >= n) return;
          const pre = new Image();
          pre.src = SLIDESHOW_SOURCES[i];
        }

        prefetchSlideIndex(1 % n);
        setTimeout(() => prefetchSlideIndex(2 % n), 400);

        if (n === 1) return;

        let activeIdx = 0;

        const wait = (ms) =>
          new Promise((resolve) => {
            slideshowTimer = setTimeout(resolve, ms);
          });

        while (true) {
          await wait(5000);
          const standby = layers[1 - activeIdx];
          const picked = await resolveNextSlide((slideshowIndex + 1) % n, standby);
          if (picked < 0) continue;

          crossfade(activeIdx, false);
          activeIdx = 1 - activeIdx;
          slideshowIndex = picked;

          prefetchSlideIndex((slideshowIndex + 2) % n);
        }
      })();
    }
  </script>
</body>
</html>
