<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LD Studios infoskærm dashboard</title>
  <link rel="preload" href="01Logo_white_HIGH.png" as="image">
  <link rel="preload" href="LDstudiiosmap.png" as="image">
  <style>
    :root {
      --bg-color: #080b11;
      --surface-1: #111826;
      --surface-2: #171f31;
      --surface-3: #0d1320;
      --text-color: #f5f7ff;
      --muted-text: #a6b2ce;
      --primary-color: #6cb7ff;
      --secondary-color: #66e0a3;
      --room-occupied: #ff6b6b;
      --room-available: #5fdb9d;
      --room-pending: #ffd76a;
      --border-color: #2a3449;
      --font-family: "Inter", "Segoe UI", Arial, sans-serif;
      --header-height: auto;
      --footer-height: auto;
      --main-height: 1fr;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      background:
        radial-gradient(120% 100% at 10% -10%, #1f335b 0%, transparent 40%),
        radial-gradient(120% 100% at 90% -15%, #2a214f 0%, transparent 35%),
        var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      overflow-y: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      letter-spacing: 0.01em;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2vw;
      background: linear-gradient(180deg, rgba(27, 37, 60, 0.92), rgba(14, 21, 35, 0.92));
      border-bottom: 1px solid var(--border-color);
    }

    .welcome-title {
      font-size: 2.1vw;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #eaf1ff;
      text-transform: uppercase;
      text-align: center;
    }

    .logo {
      height: 7vh;
      max-width: 35vw;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.4));
    }

    .datetime {
      text-align: right;
      font-size: 2.3vw;
      font-weight: 700;
      line-height: 1.1;
    }

    .date {
      margin-top: 0.35vw;
      font-size: 1.25vw;
      color: var(--muted-text);
      font-weight: 500;
      text-transform: capitalize;
    }

    .build-tag {
      margin-top: 0.45vw;
      display: inline-block;
      padding: 0.2vw 0.6vw;
      border-radius: 999px;
      font-size: 0.72vw;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #061223;
      background: linear-gradient(180deg, #7ce6ae, #4dc68a);
    }

    main {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 1.2vw;
      padding: 1.2vw;
      min-height: 0;
    }

    @media (min-width: 1200px) {
      /* Større fokus på venstre tegning på kiosk/desktop-skærme */
      main {
        grid-template-columns: 2.5fr 0.7fr;
      }

      .studio-visual {
        padding: 0;
      }

      .studio-visual img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: scale(1.34);
        transform-origin: center center;
      }
    }

    @media (min-width: 1700px) {
      /* Giv højre panel mere plads på store kiosk-skærme */
      main {
        grid-template-columns: 1.45fr 1.15fr;
      }
    }

    .studio-visual {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.9vw;
      position: relative;
      background: linear-gradient(165deg, rgba(27, 34, 52, 0.9), rgba(16, 23, 37, 0.9));
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .studio-visual img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center center;
      border-radius: 12px;
    }

    .side-empty-box {
      border: 1px solid var(--border-color);
      border-radius: 18px;
      background: linear-gradient(165deg, rgba(27, 34, 52, 0.55), rgba(16, 23, 37, 0.55));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      align-self: stretch;
    }

    .side-placeholder {
      color: #8ea0c8;
      font-size: 0.95vw;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 1vw;
      max-width: 90%;
    }

    .slideshow-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(42, 54, 82, 0.5) 0%, rgba(16, 23, 37, 0.85) 100%);
    }

    .slideshow-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      border-radius: 16px;
      opacity: 0;
      transition: opacity 2000ms linear;
      will-change: opacity;
      pointer-events: none;
      background: transparent;
    }

    .slideshow-layer.is-visible {
      opacity: 1;
    }

    .slideshow-fallback {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1vw;
      color: #8ea0c8;
      font-size: 0.95vw;
      letter-spacing: 0.02em;
      background: rgba(8, 11, 17, 0.55);
      backdrop-filter: blur(2px);
    }

    .slideshow-fallback[hidden] {
      display: none !important;
    }

    footer {
      background: linear-gradient(180deg, rgba(16, 23, 37, 0.96), rgba(10, 16, 27, 0.98));
      border-top: 1px solid var(--border-color);
      padding: 1.1vw 1.4vw;
      margin: 0 1.2vw 1.2vw;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      overflow-y: auto;
      gap: 0.7vw;
      min-height: 0;
    }

    .upcoming-header {
      font-size: 1.25vw;
      font-weight: 700;
      color: #d9e4ff;
      margin-bottom: 0.2vw;
    }

    .upcoming-bookings-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.65vw;
      min-height: 0;
    }

    .studio-booking-card {
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(41, 54, 80, 0.45), rgba(22, 31, 49, 0.65));
      border: 1px solid rgba(100, 117, 153, 0.3);
      color: #e5ebfd;
      padding: 0.65vw 0.75vw;
      min-height: 8.4vh;
      display: flex;
      flex-direction: column;
      gap: 0.3vw;
      overflow: hidden;
    }

    .studio-booking-title {
      font-size: 0.98vw;
      font-weight: 700;
      color: #f0f5ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .studio-booking-line {
      font-size: 0.86vw;
      color: #b8c4e2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .studio-booking-now {
      font-weight: 800;
      color: var(--secondary-color);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.82vw;
    }

    @media (max-width: 768px) {
      body {
        grid-template-rows: auto 1fr auto;
        overflow-y: auto;
        height: auto;
        min-height: 100vh;
      }

      header {
        flex-direction: column;
        text-align: center;
        padding: 3vw;
      }

      .logo {
        height: 7vh;
        margin-bottom: 1vh;
      }

      .datetime {
        font-size: 6vw;
      }

      .welcome-title {
        font-size: 5vw;
      }

      .date {
        font-size: 3.2vw;
      }

      .build-tag {
        margin-top: 1.2vw;
        font-size: 2vw;
        padding: 0.8vw 2.2vw;
      }

      main {
        grid-template-columns: 1fr;
        gap: 2vw;
        padding: 3vw 3vw 1.5vw;
      }

      .studio-visual {
        height: 48vh;
        padding: 2vw;
      }

      .side-empty-box {
        min-height: 12vh;
      }

      .side-placeholder {
        font-size: 2.8vw;
        padding: 2vw;
      }

      .slideshow-layer,
      .slideshow-frame {
        border-radius: 14px;
      }

      footer {
        padding: 3vw;
        margin: 0 3vw 3vw;
        gap: 2vw;
      }

      .upcoming-header {
        font-size: 4.3vw;
      }

      .upcoming-bookings-list {
        grid-template-columns: 1fr;
        gap: 2vw;
      }

      .studio-booking-card {
        padding: 2.2vw 2.6vw;
        min-height: auto;
      }

      .studio-booking-title {
        font-size: 3.4vw;
      }

      .studio-booking-line {
        font-size: 3vw;
      }

      .studio-booking-now {
        font-size: 2.85vw;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://ld-dk2600.github.io/LD_screen1/01Logo_white_HIGH.png" alt="LD Studios Logo" class="logo" fetchpriority="high" decoding="async">
    <div class="welcome-title">Velkommen</div>
    <div class="datetime">
      <div class="time" id="time"></div>
      <div class="date" id="date"></div>
      <div class="build-tag">LIVE V2</div>
    </div>
  </header>

  <main>
    <div class="studio-visual">
      <img src="https://ld-dk2600.github.io/LD_screen1/LDstudiiosmap.png" alt="Studio Layout" fetchpriority="high" decoding="async">
    </div>
    <div class="side-empty-box" aria-label="Billedeshow">
      <div class="slideshow-frame" id="slideshow-frame">
        <img id="slideshow-a" class="slideshow-layer is-visible" alt="LD Studios" decoding="async" loading="eager" src="slideshow-opt/car-1.jpg">
        <img id="slideshow-b" class="slideshow-layer" alt="" decoding="async" loading="eager">
        <div class="slideshow-fallback" id="slideshow-fallback" hidden>Indlæser billeder...</div>
      </div>
    </div>

  </main>

  <footer>
    <div class="upcoming-header">Hvem er i studierne i dag:</div>
    <div class="upcoming-bookings-list" id="upcoming-bookings-list"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const BRUGE_SUPABASE = true;
    /** Ingen trailing slash — ellers kan klienten give mærkelige 404. */
    const SUPABASE_URL = "https://vvrruinrupnginlkixeq.supabase.co".replace(/\/+$/, "");
    /** Brug **Project API key → anon public** (klassisk `eyJ...` JWT), ikke service role. `sb_publishable_` virker kun hvis det matcher dit projekt. */
    const SUPABASE_ANON_KEY = "sb_publishable_YbvhilZ2n49AVN1VWZvEuw_1vjQP-mk";
    /** Prøves i rækkefølge indtil REST ikke svarer med “relation not found” (404 / PGRST205). */
    const SUPABASE_TABLE_STUDIO = ["Studio", "studio", "Studios", "studios"];
    const SUPABASE_TABLE_BOOKING = ["Booking", "booking", "Bookings", "bookings"];
    const SUPABASE_TABLE_CUSTOMER = ["Customer", "customer", "Customers", "customers"];
    const DEFAULT_STUDIOS = [
      { id: "studio-1", name: "Studie 1" },
      { id: "studio-2", name: "Studie 2" },
      { id: "studio-3", name: "Studie 3" },
      { id: "studio-4", name: "Studie 4" }
    ];

    const SLIDESHOW_FOLDER = "slideshow-opt";
    const SLIDESHOW_MANIFEST = `${SLIDESHOW_FOLDER}/manifest.json`;
    const SLIDE_SHOW_MS = 5000; // tid pr billede (uden fade)
    const SLIDE_FADE_MS = 2000; // fade transition
    /** Én klient til hele fanen — undgår "Multiple GoTrueClient instances"-advarslen. */
    let supabaseClientSingleton = null;

    function getSupabaseClient() {
      if (!supabaseClientSingleton && window.supabase && typeof window.supabase.createClient === "function") {
        supabaseClientSingleton = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
        });
      }
      return supabaseClientSingleton;
    }

    function isMissingTableError(err) {
      if (!err) return false;
      const code = String(err.code || "");
      const status = Number(err.status || err.statusCode || 0);
      const msg = String(err.message || "").toLowerCase();
      if (status === 404) return true;
      if (code === "PGRST205" || code === "42P01") return true;
      if (msg.includes("schema cache")) return true;
      if (msg.includes("does not exist")) return true;
      if (msg.includes("not find the table")) return true;
      if (msg.includes("relation") && msg.includes("exist")) return true;
      return false;
    }

    async function supabaseSelectFirstTable(client, candidates, columns) {
      let lastErr = null;
      for (let i = 0; i < candidates.length; i += 1) {
        const name = candidates[i];
        const { data, error } = await client.from(name).select(columns);
        if (!error) {
          if (i > 0) console.info("LD_screen1: bruger Supabase-tabel", JSON.stringify(name));
          return { rows: data || [], table: name };
        }
        lastErr = error;
        if (isMissingTableError(error)) continue;
        throw error;
      }
      throw lastErr || new Error(`Ingen af tabellerne virkede: ${candidates.join(", ")}`);
    }

    async function initSupabase() {
      if (BRUGE_SUPABASE) {
        try {
          return await getLiveSupabaseData();
        } catch (error) {
          console.error("Supabase fetch failed, using empty studio fallback:", error);
          return getEmptyStudioState();
        }
      } else {
        return getMock();
      }
    }

    function pickFirst(obj, keys) {
      if (!obj) return undefined;
      for (let i = 0; i < keys.length; i += 1) {
        const v = obj[keys[i]];
        if (v !== undefined && v !== null && v !== "") return v;
      }
      return undefined;
    }

    function bookingStatusAllowed(statusRaw) {
      const s = String(statusRaw || "").trim().toLowerCase().replace(/\s+/g, "_");
      if (!s) return true;
      const blocked = new Set(["cancelled", "canceled", "declined", "no_show", "draft", "rejected"]);
      return !blocked.has(s);
    }

    async function getLiveSupabaseData() {
      const client = getSupabaseClient();
      if (!client) {
        throw new Error("Supabase SDK ikke tilgængelig");
      }

      let studios = [];
      try {
        const sr = await supabaseSelectFirstTable(client, SUPABASE_TABLE_STUDIO, "id,name");
        studios = sr.rows;
      } catch (e) {
        if (isMissingTableError(e)) {
          console.warn("LD_screen1: ingen Studio-tabel fundet — forsætter med bookinger alene:", e.message || e);
        } else {
          throw e;
        }
      }

      const br = await supabaseSelectFirstTable(client, SUPABASE_TABLE_BOOKING, "*");
      const bookingsRaw = br.rows;

      let customerNameById = new Map();
      try {
        const cr = await supabaseSelectFirstTable(client, SUPABASE_TABLE_CUSTOMER, "id,name");
        customerNameById = new Map(cr.rows.map((c) => [String(c.id), c.name || "Ukendt kunde"]));
      } catch (error) {
        if (isMissingTableError(error)) {
          console.warn("LD_screen1: Customer ikke tilgængelig eller andet navn — fortsætter uden lookup.");
        } else {
          console.warn("Customer lookup:", error.message || error);
        }
      }

      const rooms = (studios || [])
        .filter((studio) => {
          const n = (studio.name || "").toLowerCase();
          return n.includes("studie") || n.includes("studio");
        })
        .map((studio) => ({
          id: `studio-${studio.id}`,
          name: studio.name
        }));

      const bookings = (bookingsRaw || [])
        .filter((b) => bookingStatusAllowed(pickFirst(b, ["status", "Status"])))
        .map((booking) => {
          const studioId = pickFirst(booking, [
            "studioId",
            "studio_id",
            "StudioId",
            "room_id",
            "roomId",
            "studio"
          ]);
          const startRaw = pickFirst(booking, ["startTime", "start_time", "StartTime", "start", "from"]);
          const endRaw = pickFirst(booking, ["endTime", "end_time", "EndTime", "end", "to"]);
          const customerId = pickFirst(booking, ["customerId", "customer_id", "CustomerId"]);
          const inlineName = pickFirst(booking, [
            "customerName",
            "customer_name",
            "guestName",
            "guest_name",
            "clientName",
            "client_name"
          ]);

          if (!studioId || startRaw == null || endRaw == null) {
            return null;
          }

          const startDate = new Date(startRaw);
          const endDate = new Date(endRaw);
          if (Number.isNaN(startDate.valueOf()) || Number.isNaN(endDate.valueOf())) {
            return null;
          }

          const sid = String(studioId).trim();
          const room_id = sid.toLowerCase().startsWith("studio-") ? sid : `studio-${sid}`;

          const lookupName =
            (customerId != null && customerNameById.get(String(customerId))) || inlineName || null;

          return {
            room_id,
            start_time: startDate.toISOString(),
            end_time: endDate.toISOString(),
            title: pickFirst(booking, ["title", "name", "subject", "Title"]) || "Booking",
            customer_name: lookupName || "Ukendt kunde",
            status: String(pickFirst(booking, ["status", "Status"]) || "").toLowerCase()
          };
        })
        .filter(Boolean);

      bookings.sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

      const rawCount = (bookingsRaw || []).length;
      if (rawCount > 0 && bookings.length === 0) {
        console.warn(
          "LD_screen1: Hentede",
          rawCount,
          "booking-rækker, men ingen kunne bruges. Tjek kolonnenavne (start/slut, studie-id). Eksempel:",
          bookingsRaw[0]
        );
      }

      let displayRooms = rooms;
      if (!displayRooms.length) {
        if (bookings.length > 0) {
          const uniq = [...new Set(bookings.map((b) => b.room_id))].sort();
          displayRooms = uniq.map((id, idx) => ({
            id,
            name: `Studie ${idx + 1}`
          }));
        } else {
          displayRooms = DEFAULT_STUDIOS;
        }
      }

      return { rooms: displayRooms, bookings };
    }

    function getEmptyStudioState() {
      return { rooms: DEFAULT_STUDIOS, bookings: [] };
    }

    function getMock() {
      const now = new Date();
      const addHours = (date, h) => new Date(date.getTime() + h * 60 * 60 * 1000);
      const addMinutes = (date, m) => new Date(date.getTime() + m * 60 * 1000);

      const rooms = [
        { id: "studio-1", name: "Studio 1" },
        { id: "studio-2", name: "Studio 2" }
      ];

      const bookings = [
        { room_id: "studio-1", start_time: addMinutes(now, -30).toISOString(), end_time: addMinutes(now, 30).toISOString(), title: "Session A", status: "occupied" },
        { room_id: "studio-2", start_time: addHours(now, 1).toISOString(), end_time: addHours(now, 3).toISOString(), title: "Session B", status: "pending" },
        { room_id: "studio-1", start_time: addHours(now, 2).toISOString(), end_time: addHours(now, 4).toISOString(), title: "Session C", status: "pending" },
        { room_id: "studio-2", start_time: addMinutes(now, -90).toISOString(), end_time: addMinutes(now, -30).toISOString(), title: "Past Session D", status: "completed" }
      ];

      return { rooms, bookings };
    }

    function fmt(dateString) {
      const date = new Date(dateString);
      return date.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
    }

    async function render() {
      const { rooms, bookings } = await initSupabase();
      const upcomingBookingsList = document.getElementById("upcoming-bookings-list");
      upcomingBookingsList.innerHTML = "";

      const now = new Date();
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);

      const relevantBookings = bookings.filter((b) => {
        const bookingDate = new Date(b.start_time);
        return bookingDate >= today && bookingDate < tomorrow;
      });

      rooms.forEach((room) => {
        const roomBookings = relevantBookings
          .filter((b) => b.room_id === room.id)
          .sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

        const nowTs = now.getTime();
        const activeNow = roomBookings.find((b) => {
          const t0 = new Date(b.start_time).getTime();
          const t1 = new Date(b.end_time).getTime();
          return t0 <= nowTs && nowTs < t1;
        });

        const nextBooking =
          activeNow ||
          roomBookings.find((b) => new Date(b.start_time) > nowTs) ||
          roomBookings.find((b) => new Date(b.end_time) >= nowTs) ||
          roomBookings[0];

        const card = document.createElement("div");
        card.classList.add("studio-booking-card");

        if (activeNow) {
          card.innerHTML = `
            <div class="studio-booking-title">${room.name}</div>
            <div class="studio-booking-line studio-booking-now">I studiet nu</div>
            <div class="studio-booking-line">${activeNow.customer_name || "Ukendt kunde"}</div>
            <div class="studio-booking-line">${activeNow.title || "Booking"}</div>
            <div class="studio-booking-line">${fmt(activeNow.start_time)} – ${fmt(activeNow.end_time)}</div>
          `;
        } else if (nextBooking) {
          card.innerHTML = `
            <div class="studio-booking-title">${room.name}</div>
            <div class="studio-booking-line">Næste i dag</div>
            <div class="studio-booking-line">${nextBooking.customer_name || "Ukendt kunde"}</div>
            <div class="studio-booking-line">${nextBooking.title || "Booking"}</div>
            <div class="studio-booking-line">${fmt(nextBooking.start_time)} – ${fmt(nextBooking.end_time)}</div>
          `;
        } else {
          card.innerHTML = `
            <div class="studio-booking-title">${room.name}</div>
            <div class="studio-booking-line">Ingen bookinger i dag</div>
          `;
        }

        upcomingBookingsList.appendChild(card);
      });
    }

    function clock() {
      const now = new Date();
      const timeElement = document.getElementById("time");
      const dateElement = document.getElementById("date");

      timeElement.textContent = now.toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
      dateElement.textContent = now.toLocaleDateString("da-DK", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      render();
      setTimeout(clock, 1000 * 30);
    }

    async function initSlideshow() {
      const frame = document.getElementById("slideshow-frame");
      const imgA = document.getElementById("slideshow-a");
      const imgB = document.getElementById("slideshow-b");
      const fallback = document.getElementById("slideshow-fallback");
      if (!frame || !imgA || !imgB) return;

      const showFallback = (text) => {
        if (!fallback) return;
        fallback.textContent = text || "Indlæser billeder...";
        fallback.hidden = false;
      };
      const hideFallback = () => {
        if (!fallback) return;
        fallback.hidden = true;
      };

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      function isLikelyBlackFrame(imageEl) {
        try {
          const w = Math.max(8, Math.min(48, imageEl.naturalWidth || 0));
          const h = Math.max(8, Math.min(48, imageEl.naturalHeight || 0));
          if (!w || !h) return true;

          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          if (!ctx) return false;

          ctx.drawImage(imageEl, 0, 0, w, h);
          const data = ctx.getImageData(0, 0, w, h).data;
          let lumMin = 255;
          let lumMax = 0;
          let lumSum = 0;
          const pxCount = w * h;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const lum = Math.round(0.2126 * r + 0.7152 * g + 0.0722 * b);
            if (lum < lumMin) lumMin = lum;
            if (lum > lumMax) lumMax = lum;
            lumSum += lum;
          }

          const avg = lumSum / pxCount;
          const range = lumMax - lumMin;
          // Kun nær-sort OG næsten ensfarvet
          return avg < 10 && range < 8;
        } catch (_) {
          return false;
        }
      }

      const loadImage = (el, url, timeoutMs = 10000) =>
        new Promise((resolve) => {
          let done = false;
          const finish = async (ok) => {
            if (done) return;
            if (ok && typeof el.decode === "function") {
              try {
                await Promise.race([
                  el.decode(),
                  new Promise((r) => setTimeout(r, 1200))
                ]);
              } catch (_) {
                // decode kan fejle på enkelte browsere selv om billedet vises fint
              }
            }
            done = true;
            el.onload = null;
            el.onerror = null;
            resolve(ok);
          };
          el.onload = () => finish(el.naturalWidth > 0 && !isLikelyBlackFrame(el));
          el.onerror = () => finish(false);
          el.src = url;
          if (el.complete && el.naturalWidth > 0) {
            finish(el.naturalWidth > 0 && !isLikelyBlackFrame(el));
          }
          setTimeout(() => finish(false), timeoutMs);
        });

      async function fetchManifestUrls() {
        try {
          const res = await fetch(SLIDESHOW_MANIFEST, { cache: "no-store" });
          if (!res.ok) throw new Error(`manifest ${res.status}`);
          const json = await res.json();
          const files = Array.isArray(json?.files) ? json.files : [];
          return files
            .map((f) => String(f || "").trim())
            .filter(Boolean)
            .map((f) => (f.includes("/") ? f : `${SLIDESHOW_FOLDER}/${encodeURI(f)}`));
        } catch (e) {
          console.warn("Slideshow: kunne ikke hente manifest:", e);
          return [];
        }
      }

      const urls = await fetchManifestUrls();
      if (urls.length === 0) {
        showFallback("Ingen billeder i slideshow-mappen.");
        return;
      }

      // Find første billede der kan loades
      showFallback("Indlæser billeder...");
      let startIx = -1;
      for (let i = 0; i < urls.length; i += 1) {
        if (await loadImage(imgA, urls[i])) {
          startIx = i;
          break;
        }
      }
      if (startIx < 0) {
        showFallback("Kunne ikke indlæse billeder.");
        return;
      }

      hideFallback();
      imgA.classList.add("is-visible");
      imgB.classList.remove("is-visible");

      let front = imgA;
      let back = imgB;
      let ix = startIx;

      // uendelig loop: 5s visning + 2s fade
      while (true) {
        await wait(SLIDE_SHOW_MS);

        // preload næste (spring fejl over)
        let nextIx = (ix + 1) % urls.length;
        let ok = false;
        for (let tries = 0; tries < urls.length; tries += 1) {
          ok = await loadImage(back, urls[nextIx]);
          if (ok) break;
          nextIx = (nextIx + 1) % urls.length;
        }
        if (!ok) {
          showFallback("Ingen billeder kunne indlæses.");
          return;
        }

        // start fade
        requestAnimationFrame(() => {
          back.classList.add("is-visible");
          front.classList.remove("is-visible");
        });

        await wait(SLIDE_FADE_MS);

        // swap buffers
        ix = nextIx;
        const tmp = front;
        front = back;
        back = tmp;
      }
    }


    document.addEventListener("DOMContentLoaded", () => {
      initSlideshow();
      clock();
    });
  </script>
</body>
</html>
